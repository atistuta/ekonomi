name: KAP Poller (AKTİF — bildirim kaynağı)

# ✅ TEK bildirim kaynağı. Worker canlı izleme-listesini /api/watchlist'ten (Vercel KV)
# herkese açık GET ile okur, yeni KAP/haber/makro + fiyat-sıçramalarını ntfy.sh'e push eder.
# Harici cron (cron-job.org) ya da Vercel Plan A (api/poll.js) KULLANILMIYOR — ÇİFT bildirim
# olmaması için yalnız bu worker çalışıyor. Plan A yedektir; ikisini AYNI anda açma.
# İlk çalıştırmada patlama olmaması için poll.mjs/movers.mjs'de MAX_PUSH=10 sınırı var.

on:
  schedule:
    - cron: '*/15 * * * *'   # her 15 dk (GitHub Actions zamanı birkaç dk gecikebilir)
  workflow_dispatch:          # elle tetikleme de açık

jobs:
  poll:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install deps
        working-directory: worker
        run: npm install --no-audit --no-fund

      - name: Run poll (haber)
        working-directory: worker
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: node poll.mjs

      - name: Run movers (fiyat sıçraması)
        working-directory: worker
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: node movers.mjs

      - name: Commit state
        run: |
          git config user.name "kap-poller"
          git config user.email "kap-poller@users.noreply.github.com"
          git add worker/.seen.json worker/.movers.json || true
          if ! git diff --staged --quiet; then
            git commit -m "chore: update poller state [skip ci]"
            git push
          fi
